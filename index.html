<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F7FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="쉬쉬기록">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>쉬쉬기록</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* Layout: one phone column. Today = status, 5 big buttons, 24h ring clock, memo, timeline (newest on top). Records = day/week/month calendars. Fixed 3-tab bar. */
:root{
  --bg:#F5F7FC; --surface:#FFFFFF; --ink:#2A3142; --muted:#7B859A; --line:#E5E9F2; --soft:#EEF2F9;
  --pee:#DCEBFB; --pee-ink:#2F6CA6; --pee-dot:#5AA2E6;
  --poo:#F4E8DA; --poo-ink:#8A5B33; --poo-dot:#B07A4C;
  --pants:#FCE3EE; --pants-ink:#A8456F; --pants-band:#F5A9C8; --diaper-band:#A9DEC2;
  --oops:#FFE8D3; --oops-ink:#AD5E22; --oops-dot:#F29A55;
  --diaper:#DFF3E8; --diaper-ink:#3A8460; --diaper-dot:#62B98D;
  --memo:#EEE8FA; --memo-ink:#65509B;
  --sleep:#E8E3FA; --sleep-ink:#5A4C9E; --sleep-band:#B7ACEA; --dry:#FFF3CC; --dry-ink:#93700F; --dry-dot:#F2C94C;
  --night:#ECE8F8; --dots:#E2E8F4; --danger:#C2453D; --sticker:#FFFFFF; --sky1:#CDE5FF; --sky2:#FFE1EE; --cloud:#FFFFFF; --star:#FFD66B; --sel:#2A3142;
  --shadow:0 1px 2px rgba(42,49,66,.04),0 6px 18px rgba(42,49,66,.06);
  --f-display:"Jua","Nanum Gothic",system-ui,sans-serif;
  --f-body:"Nanum Gothic",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171D; --surface:#1D2129; --ink:#E8ECF3; --muted:#99A3B5; --line:#2B313C; --soft:#242934;
  --pee:#1D3046; --pee-ink:#90C3F0; --pee-dot:#6CB0F0; --poo:#33291F; --poo-ink:#E0B58C; --poo-dot:#C99363;
  --pants:#38222E; --pants-ink:#F0A4C2; --pants-band:#9C4D70; --diaper-band:#3F7A5C; --oops:#3A2919; --oops-ink:#F2AF79; --oops-dot:#F29A55;
  --diaper:#1C3228; --diaper-ink:#8ED2AD; --diaper-dot:#62B98D; --memo:#29233F; --memo-ink:#BBA9EF; --sleep:#28243F; --sleep-ink:#BDB2F2; --sleep-band:#5E539A; --dry:#3A321A; --dry-ink:#F0CF6E; --dry-dot:#E2B93E;
  --night:#232237; --dots:#20242C; --danger:#F08A82; --sticker:#2E3440; --sky1:#22314A; --sky2:#3A2840; --cloud:#3A4458; --star:#E8C36A; --sel:#E8ECF3; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171D; --surface:#1D2129; --ink:#E8ECF3; --muted:#99A3B5; --line:#2B313C; --soft:#242934;
  --pee:#1D3046; --pee-ink:#90C3F0; --pee-dot:#6CB0F0; --poo:#33291F; --poo-ink:#E0B58C; --poo-dot:#C99363;
  --pants:#38222E; --pants-ink:#F0A4C2; --pants-band:#9C4D70; --diaper-band:#3F7A5C; --oops:#3A2919; --oops-ink:#F2AF79; --oops-dot:#F29A55;
  --diaper:#1C3228; --diaper-ink:#8ED2AD; --diaper-dot:#62B98D; --memo:#29233F; --memo-ink:#BBA9EF; --sleep:#28243F; --sleep-ink:#BDB2F2; --sleep-band:#5E539A; --dry:#3A321A; --dry-ink:#F0CF6E; --dry-dot:#E2B93E;
  --night:#232237; --dots:#20242C; --danger:#F08A82; --sticker:#2E3440; --sky1:#22314A; --sky2:#3A2840; --cloud:#3A4458; --star:#E8C36A; --sel:#E8ECF3; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:radial-gradient(var(--dots) 1.6px,transparent 1.8px) 0 0/26px 26px,radial-gradient(var(--dots) 1.6px,transparent 1.8px) 13px 13px/26px 26px,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 124px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pee-dot);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);font-weight:400}

/* header */
.sky{position:relative;overflow:hidden;border-radius:30px;padding:14px 16px 16px;background:linear-gradient(160deg,var(--sky1),var(--sky2));border:3px solid var(--sticker);box-shadow:4px 5px 0 rgba(90,120,170,.18);display:flex;flex-direction:column;gap:10px}
.sky .cl{position:absolute;background:var(--cloud);border-radius:999px;opacity:.85;pointer-events:none}
.sky .cl::before,.sky .cl::after{content:"";position:absolute;background:var(--cloud);border-radius:50%}
.sky .cl::before{width:55%;height:150%;left:15%;bottom:20%}
.sky .cl::after{width:40%;height:120%;right:12%;bottom:25%}
.sky .c1{width:70px;height:18px;right:18px;top:62px}.sky .c2{width:46px;height:12px;right:96px;top:22px;opacity:.6}.sky .c3{width:56px;height:14px;left:-14px;bottom:14px;opacity:.55}
.sky .stx{position:absolute;color:var(--star);font-size:14px;pointer-events:none}
.sky .sun{position:absolute;right:22px;top:16px;width:34px;height:34px;border-radius:50%;background:#FFD66B;box-shadow:0 0 0 7px rgba(255,214,107,.35),0 0 0 14px rgba(255,214,107,.15);pointer-events:none}
.sky .moon{position:absolute;right:24px;top:14px;width:30px;height:30px;border-radius:50%;box-shadow:-8px 4px 0 0 #FFE8A3;transform:rotate(-20deg);pointer-events:none}
.sky.night{background:linear-gradient(160deg,#28305E,#4A3C78);color:#F1F2FA}
.sky.night .app,.sky.night .date,.sky.night .kid small{color:#C9CDE8}
.sky.night .cl{opacity:.12!important}
.sky.night .stx{color:#FFE8A3;animation:tw 2.4s ease-in-out infinite}
.sky.night .stx:nth-of-type(2n){animation-delay:1.1s}
@keyframes tw{50%{opacity:.35}}
.sky.night .say{background:#FFFFFF;color:#2A3142}
.sky .sun,.sky .moon{position:absolute!important;z-index:0!important}
.sky .date{padding-top:34px}
.sky .top{align-items:flex-start}
.sky>*:not(.cl):not(.stx){position:relative;z-index:1}
.top{display:flex;align-items:center;gap:10px}
.mascot{flex:none;width:52px;height:60px;animation:bob 3.2s ease-in-out infinite}
.mascot.happy{animation:hop .6s ease 2}
@keyframes hop{30%{transform:translateY(-8px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.say{position:relative;background:var(--surface);border-radius:18px;padding:9px 13px;font-size:14px;font-weight:700;color:var(--ink);line-height:1.35;box-shadow:0 3px 0 rgba(90,110,150,.14)}
.say::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;width:14px;height:14px;background:inherit;border-radius:3px;transform:rotate(45deg)}
.say.hi{color:var(--pee-ink)}

.greet{display:flex;align-items:center;gap:12px}

@keyframes bob{50%{transform:translateY(-3px)}}
.top .who{flex:1;min-width:0}
.app{font-size:12px;color:var(--muted);letter-spacing:.04em}
.kid{font-family:var(--f-display);font-size:26px;line-height:1.2;padding:0;text-align:left}
.kid small{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-left:6px}
.kid-input{font-family:var(--f-display);font-size:22px;width:100%;max-width:200px;border:2px solid var(--line);border-radius:12px;padding:2px 10px;background:var(--surface);color:var(--ink)}
.date{color:var(--muted);font-size:14px;white-space:nowrap;text-align:right}

.card{position:relative;background:var(--surface);border-radius:28px;border:3px solid var(--sticker);outline:2px dashed var(--line);outline-offset:-10px;box-shadow:3px 4px 0 rgba(90,110,150,.12);padding:20px!important;box-shadow:var(--shadow);padding:16px}
.card h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 span{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:13px}

/* hero status */
.hero{position:relative;overflow:hidden;background:var(--pee);border-radius:30px;border:3px solid var(--sticker);box-shadow:4px 5px 0 rgba(47,108,166,.18);padding:18px 18px 14px;color:var(--pee-ink);display:flex;flex-direction:column;gap:10px}
.hero::after{content:"";background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.6) 0 18%,transparent 19%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.45) 0 10%,transparent 11%);width:120px;height:120px;position:absolute;right:14px;top:6px;font-size:64px;opacity:.18;transform:rotate(14deg);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:14px;font-weight:800}
.hero .big{font-family:var(--f-display);font-size:clamp(32px,10vw,44px);line-height:1.1}
.hero .since{font-size:13px;opacity:.85}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mini{background:var(--surface);border-radius:16px;padding:8px 10px;min-width:0}
.mini .l{font-size:12px;color:var(--muted)}
.mini .v{font-family:var(--f-display);font-size:16px;line-height:1.25;color:var(--ink)}
.states{display:flex;flex-wrap:wrap;gap:8px}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.st.pants{background:var(--pants);color:var(--pants-ink)}
.st.diaper{background:var(--diaper);color:var(--diaper-ink)}
.st.poo{background:var(--poo);color:var(--poo-ink)}

/* record buttons */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec{position:relative;border-radius:26px;border:3px solid var(--sticker);box-shadow:3px 5px 0 var(--shd,rgba(42,49,66,.15)),inset 0 -5px 0 rgba(42,49,66,.06);padding:16px 14px;min-height:96px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:4px;text-align:left;transition:transform .12s ease;overflow:hidden}
.rec .ic{font-size:30px;line-height:1}
.rec .t{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.25}
.rec .ic{display:inline-block;transition:transform .2s}
.rec:hover .ic{transform:rotate(-10deg) scale(1.08)}
.rec::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:currentColor;opacity:.07}
.rec:active{transform:translate(3px,4px);box-shadow:0 1px 0 var(--shd,rgba(42,49,66,.15))}
.rec .ic svg{width:44px;height:44px;display:block}
.rec.pee .ic svg{width:52px;height:52px}
.rec.poo{transform:rotate(-1.2deg)}.rec.dry{transform:rotate(1deg)}
.btns{grid-template-columns:repeat(10,1fr)!important;gap:12px 10px!important}
.btns>.rec{grid-column:span 6}
.btns>.rec.oo,.btns>.rec.small{grid-column:span 4}
.btns .rec{min-height:92px}
.btns .rec.pee{grid-column:span 6;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:4px;min-height:104px}
.btns .rec.pee .ic svg{width:50px;height:50px}.btns .rec.pee .t{font-size:24px}
.rec.pee{transform:rotate(-.8deg)}
.rec.oo{background:radial-gradient(var(--dotc) 1.5px,transparent 1.8px) 0 0/14px 14px,linear-gradient(160deg,var(--surface) 40%,var(--tint));border:3px dashed currentColor;box-shadow:3px 5px 0 var(--shd,rgba(42,49,66,.12));padding-top:14px;overflow:hidden}
.rec.oo .t{display:flex;flex-direction:column;line-height:1.2}
.rec.oo .t small{font-family:var(--f-body);font-size:11px;font-weight:700;opacity:.75;margin-top:2px}
.rec.oo .sp{position:absolute;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--spc);opacity:.55}
.rec.oo .s1{width:10px;height:10px;right:18px;bottom:16px}
.rec.oo .s2{width:6px;height:6px;right:34px;bottom:30px}
.rec.oo .s3{width:8px;height:8px;right:12px;bottom:38px;opacity:.35}
.rec.oo .ic{animation:wob 3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}8%{transform:rotate(-10deg)}16%{transform:rotate(8deg)}24%{transform:rotate(0)}}
.rec.oo:hover .tag{transform:rotate(-6deg) scale(1.1)}
.rec.oo .ic svg{width:38px;height:38px}.rec.oo .t{font-size:17px}
.rec.oo::after{display:none}
.rec.pee-o{--tint:var(--pee);--dotc:rgba(90,162,230,.18);--spc:var(--pee-dot);border-color:var(--pee-dot);color:var(--pee-ink);--shd:rgba(47,108,166,.18);transform:rotate(1.4deg)}
.rec.poo-o{--tint:var(--poo);--dotc:rgba(176,122,76,.16);--spc:var(--poo-dot);border-color:var(--poo-dot);color:var(--poo-ink);--shd:rgba(138,91,51,.18);transform:rotate(1deg)}
.rec .tag{position:absolute;right:10px;top:8px;transition:transform .2s;box-shadow:0 2px 0 rgba(173,94,34,.2);font-family:var(--f-display);font-size:13px;background:var(--oops);color:var(--oops-ink);border-radius:999px;padding:1px 8px;transform:rotate(8deg)}
.rec.sleep,.rec.wake{transform:rotate(-1deg)}
.btns .rec.small{align-self:center;min-height:78px;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;transform:rotate(2deg)}
.btns .rec.small .t{white-space:nowrap}
.btns .rec.small .ic svg{width:32px;height:32px}.btns .rec.small .t{font-size:16px}
.btns .rec.sleep .ic svg,.btns .rec.wake .ic svg{width:48px;height:48px}.btns .rec.sleep .t,.btns .rec.wake .t{font-size:21px}
.btns .rec:active{transform:translate(3px,4px)}
.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:-4px;padding:0 4px}
.tools .tt{font-family:var(--f-display);font-size:17px;color:var(--muted)}
.wearmini{display:flex;gap:2px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px}
.wi{width:40px;height:34px;border-radius:999px;display:grid;place-items:center;transition:transform .12s}
.wi svg{width:26px;height:26px;filter:grayscale(1);opacity:.4}
.wi.on svg{filter:none;opacity:1}
.wi.pants.on{background:var(--pants);box-shadow:inset 0 0 0 2px var(--pants-band)}
.wi.diaper.on{background:var(--diaper);box-shadow:inset 0 0 0 2px var(--diaper-band)}
.wi:active{transform:scale(.9)}
.oopsbox{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr 1fr;align-items:center;gap:8px;background:var(--oops);border:3px solid var(--sticker);border-radius:24px;padding:8px 10px;box-shadow:3px 5px 0 rgba(173,94,34,.25)}
.oopsbox .ol{font-family:var(--f-display);font-size:13px;line-height:1.2;color:var(--oops-ink);padding-left:4px}
.obtn{display:flex;align-items:center;justify-content:center;gap:4px;min-height:54px;padding:0 6px;border-radius:18px;background:var(--surface);color:var(--oops-ink);font-family:var(--f-display);font-size:16px;white-space:nowrap;min-width:0;transition:transform .12s}
.obtn svg{width:28px;height:28px;flex:none}
.obtn:active{transform:scale(.95)}
.lowrow{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.rec.xs{min-height:0;flex-direction:row;align-items:center;gap:6px;padding:6px 12px;border-radius:18px;box-shadow:2px 3px 0 var(--shd,rgba(42,49,66,.15))}
.rec.xs .ic svg{width:26px;height:26px}.rec.xs .t{font-size:15px;white-space:nowrap}.rec.xs::after{display:none}.rec.oops{transform:rotate(1deg)}.rec.sm.dry{transform:rotate(.6deg)}.rec.sm.sleep,.rec.sm.wake{transform:rotate(-.6deg)}
.rec.sm{min-height:58px;flex-direction:row;align-items:center;gap:8px;padding:8px 12px;border-radius:20px}
.rec.sm .ic svg{width:32px;height:32px}.rec.sm .t{font-size:16px}
.rec.sm::after{display:none}
.wear{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:4px}
.wear .wl{font-size:13px;font-weight:700;color:var(--muted);padding:0 2px 0 4px}
.wbtn{display:flex;align-items:center;gap:5px;border-radius:14px;padding:4px 8px;min-height:40px;font-family:var(--f-display);font-size:15px;color:var(--muted);background:var(--soft);transition:transform .12s}
.wbtn svg{width:24px;height:24px;flex:none;filter:grayscale(.8);opacity:.6}
.wbtn span{display:flex;flex-direction:column;line-height:1.15;text-align:left;white-space:nowrap}
.wbtn small{font-family:var(--f-body);font-size:10px;font-weight:700}
.wbtn.on svg{filter:none;opacity:1}
.wbtn.pants.on{background:var(--pants);color:var(--pants-ink);box-shadow:inset 0 0 0 2px var(--pants-band)}
.wbtn.diaper.on{background:var(--diaper);color:var(--diaper-ink);box-shadow:inset 0 0 0 2px var(--diaper-band)}
.wbtn:active{transform:scale(.96)}
.rec.poo:active,.rec.oops:active,.rec.sm:active{transform:translate(3px,4px)}
.rec.pee{--shd:rgba(47,108,166,.28);background:var(--pee);color:var(--pee-ink);grid-column:1/-1;min-height:84px;flex-direction:row;align-items:center;justify-content:center;gap:12px}
.rec.pee .ic{font-size:38px}.rec.pee .t{font-size:28px}
.rec.poo{--shd:rgba(138,91,51,.28);background:var(--poo);color:var(--poo-ink)}
.rec.pants{--shd:rgba(168,69,111,.25);background:var(--pants);color:var(--pants-ink)}
.rec.oops{--shd:rgba(173,94,34,.25);background:var(--oops);color:var(--oops-ink)}
.rec.dry{--shd:rgba(147,112,15,.25);background:var(--dry);color:var(--dry-ink)}
.rec.sleep,.rec.wake{--shd:rgba(90,76,158,.25);background:var(--sleep);color:var(--sleep-ink)}
.st.sleep{background:var(--sleep);color:var(--sleep-ink)}
.gap.sl{opacity:.6}
.rec.diaper{--shd:rgba(58,132,96,.25);background:var(--diaper);color:var(--diaper-ink)}
.rec.dim{opacity:.55}
.rec.flash{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.03)}100%{transform:scale(1)}}

/* ring clock */
.ringbox{position:relative;width:100%;max-width:320px;margin:0 auto;aspect-ratio:1}
.ringbox svg{width:100%;height:100%;display:block}
.ring-center{position:absolute;inset:30%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring-center .l{font-size:12px;color:var(--muted)}
.ring-center .v{font-family:var(--f-display);font-size:22px;line-height:1.2}
.ring-center .s{font-size:12px;color:var(--muted)}
.rbg{fill:var(--soft)} .rnight{fill:var(--night)} .rface{fill:var(--surface)}
.rtick{stroke:var(--line);stroke-width:1.5} .rtick.major{stroke:var(--muted);stroke-width:2}
.rlab{fill:var(--muted);font-size:13px;font-family:var(--f-display)}
.rband{fill:none;stroke:var(--pants-band);stroke-width:11;stroke-linecap:butt}
.rdiaper{fill:none;stroke:var(--diaper-band);stroke-width:11;stroke-linecap:butt}
.dot{stroke:var(--surface);stroke-width:2.5}
.dot.dry{fill:var(--dry-dot)}
.dot.onband{stroke-width:3}
.rsleep{fill:none;stroke:var(--sleep-band);stroke-width:8;stroke-linecap:round}
.dot.pee{fill:var(--pee-dot)} .dot.poo{fill:var(--poo-dot)} .dot.accident{fill:var(--oops-dot)} .dot.diaper{fill:var(--diaper-dot)} .dot.pantsOn{fill:var(--pants-ink)}
.hand{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.handtip{fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend i.band{width:18px;height:8px;border-radius:4px;background:var(--pants-band)}

/* memo */
.memo-row{display:flex;gap:8px}
.memo-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;background:var(--bg);color:var(--ink)}
.memo-row button{background:var(--memo);color:var(--memo-ink);font-weight:800;border-radius:16px;padding:0 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}

/* timeline: newest on top, stacked */
.tl{display:flex;flex-direction:column;position:relative}
.tl::before{content:"";position:absolute;left:75px;border-left:2px dashed var(--line);background:none!important;top:20px;bottom:20px;width:2px;background:var(--line);border-radius:1px}
.row{position:relative;display:grid;grid-template-columns:52px 44px 1fr auto;align-items:center;gap:6px;padding:8px 2px;text-align:left;width:100%}
.row .tm{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.bub svg{width:28px;height:28px;display:block}
.bub{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;position:relative;z-index:1;border:3px solid var(--surface)}
.bub.sleep,.bub.wake{background:var(--sleep)}.bub.dry{background:var(--dry)}
.bub.pee{background:var(--pee)}.bub.poo{background:var(--poo)}.bub.pants{background:var(--pants)}.bub.oops{background:var(--oops)}.bub.diaper{background:var(--diaper)}.bub.memo{background:var(--memo)}
.row .txt{min-width:0}
.row .nm{font-weight:700;line-height:1.3}
.row .dt{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.gap{border-radius:12px;padding:4px 10px;text-align:right;line-height:1.2;white-space:nowrap}
.gap small{display:block;font-size:10px;opacity:.8;font-weight:700}
.gap b{font-family:var(--f-display);font-weight:400;font-size:16px}
.gap.pee{background:var(--pee);color:var(--pee-ink)}
.gap.poo{background:var(--poo);color:var(--poo-ink)}
.nowmark{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:0 0 4px 60px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:18px 8px}

/* records */
.mi{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin-right:2px;font-style:normal}.mi svg{width:100%;height:100%;display:block}
.pagettl{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:22px;padding:0 4px}
.pagettl .mi{width:30px;height:30px}
.pagettl small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:3px solid var(--sticker);outline:2px dashed var(--line);outline-offset:-7px;border-radius:22px;padding:6px;gap:4px;box-shadow:3px 4px 0 rgba(90,110,150,.12)}
.seg button{padding:7px 0;border-radius:16px;font-family:var(--f-display);font-size:17px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px}
.seg button .mi{width:22px;height:22px;filter:grayscale(1);opacity:.5}
.seg button[aria-pressed="true"]{background:var(--pee);color:var(--pee-ink);animation:pop .4s ease}
.seg button[aria-pressed="true"] .mi{filter:none;opacity:1}
.navbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.navbar .ttl{font-family:var(--f-display);font-size:clamp(16px,5vw,21px);white-space:nowrap;text-align:center;flex:1;min-width:0;position:relative}
.navbar .ttl::before,.navbar .ttl::after{content:"✦";color:var(--star);font-size:11px;margin:0 5px;vertical-align:3px}
.navbtn{width:42px;height:42px;border-radius:50%;background:var(--pee);color:var(--pee-ink);border:3px solid var(--sticker);box-shadow:2px 3px 0 rgba(47,108,166,.2);font-family:var(--f-display);font-size:22px;display:grid;place-items:center;line-height:1}
.navbtn:active{transform:translate(2px,3px);box-shadow:none}
.todaybtn{font-size:13px;color:var(--muted);text-decoration:underline;padding:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--soft);color:var(--muted);border:2px solid var(--sticker);box-shadow:0 2px 0 rgba(90,110,150,.1)}
.pill.pee{background:var(--pee);color:var(--pee-ink)}.pill.poo{background:var(--poo);color:var(--poo-ink)}.pill.pants{background:var(--pants);color:var(--pants-ink)}.pill.dry{background:var(--dry);color:var(--dry-ink)}.pill.oops{background:var(--oops);color:var(--oops-ink)}.pill.sleep{background:var(--sleep);color:var(--sleep-ink)}
.pill.pee b,.pill.poo b,.pill.pants b,.pill.dry b,.pill.oops b,.pill.sleep b{color:inherit;font-family:var(--f-display);font-weight:400;font-size:15px}
.pill b{color:var(--ink)}
.addbtn{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:12px;color:var(--muted);font-weight:700}

/* week strips */
.axis,.wrow{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center}
.axis .hrs{position:relative;height:16px;font-size:10px;color:var(--muted)}
.axis .hrs span{position:absolute;transform:translateX(-50%)}
.axis .hrs span:first-child{transform:none}.axis .hrs span:last-child{transform:translateX(-100%)}
.wrow{padding:8px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.wrow .dl{font-size:11px;color:var(--muted);line-height:1.15;text-align:center;background:var(--soft);border-radius:14px;padding:4px 2px}.wrow .dl b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--ink)}
.wrow.is-today .dl{background:var(--pee);color:var(--pee-ink);position:relative}.wrow.is-today .dl b{color:var(--pee-ink)}
.wrow.is-today .dl::after{content:"★";position:absolute;right:-4px;top:-6px;color:var(--star);font-size:13px}
.wrow{border-top:2px dashed var(--line)!important}
.strip{border:2px solid var(--sticker);box-shadow:inset 0 1px 3px rgba(42,49,66,.06)}
.strip{position:relative;height:26px;background:var(--soft);border-radius:13px;overflow:hidden}
.strip .nt{position:absolute;top:0;bottom:0;background:var(--sleep-band);opacity:.55}
.strip .pb{position:absolute;top:8px;height:10px;background:var(--pants-band)}
.strip .db{position:absolute;top:8px;height:10px;background:var(--diaper-band)}
.strip .pd.pantsOn,.strip .pd.diaper{top:13px;width:9px;height:9px;margin:-4.5px 0 0 -4.5px}
.strip .pd{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;border:2px solid var(--surface)}
.pd.dry{background:var(--dry-dot)}.pd.sleep,.pd.wake{display:none}
.pd.pee{background:var(--pee-dot)}.pd.poo{background:var(--poo-dot)}.pd.accident{background:var(--oops-dot)}.pd.diaper{background:var(--diaper-dot)}.pd.pantsOn{background:var(--pants-ink)}
.wsum{grid-column:2;font-size:12px;color:var(--muted);margin-top:4px}
.wsum b{color:var(--ink)}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mgrid .wd{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.mgrid .wd.sun{color:var(--danger)}
.mc{min-height:66px;border-radius:16px;background:var(--soft);border:2px solid transparent;transition:transform .12s;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;line-height:1.25;min-width:0}
.mc.out{opacity:.35}
.mc .n{font-weight:800;font-size:13px}
.mc.is-today{background:var(--pee);color:var(--pee-ink);border:2px dashed var(--pee-dot);position:relative}
.mc.is-today::after{content:"★";position:absolute;right:2px;top:0;color:var(--star);font-size:11px}
.mc.has{background:var(--surface);border-color:var(--sticker);box-shadow:2px 3px 0 rgba(90,110,150,.12)}
.mc.has.is-today{background:var(--pee);border-color:var(--pee-dot)}
.mc:active{transform:scale(.94)}
.mc .c .mi{width:12px;height:12px;vertical-align:-1px;margin-right:1px}
.mgrid .wd{font-family:var(--f-display);font-size:14px}
.mgrid .wd.sat{color:var(--pee-ink)}
.mc .c{white-space:nowrap;font-variant-numeric:tabular-nums}
.mc.blank{background:none}

/* stats */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:44px 1fr 92px;align-items:center;gap:8px}
.bar .d{font-size:14px;color:var(--muted)} .bar .d b{color:var(--ink)}
.track{position:relative;height:20px;border-radius:10px;background:var(--soft);border:2px solid var(--sticker);overflow:visible}
.fill{display:block;height:100%;border-radius:9px;background:repeating-linear-gradient(-45deg,var(--pee-dot) 0 8px,color-mix(in srgb,var(--pee-dot) 80%,#fff) 8px 16px);opacity:.75}
.track .mi{position:absolute;top:50%;width:24px;height:24px;margin:-13px 0 0 -12px;transition:left .3s}
.bar .d b{font-family:var(--f-display);font-weight:400;font-size:17px}
.bar.today .fill{opacity:1}
.bar .v{font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.bar .v.none{color:var(--muted)}
.note2{margin-top:12px;font-size:13px;color:var(--muted)}
.tip{display:flex;align-items:center;gap:10px;margin-top:14px}.tip .mascot{width:40px;height:46px}
.tip .say{background:var(--pee);color:var(--pee-ink);font-weight:700;box-shadow:none}
.tip .say b{color:inherit}
.note2 b{color:var(--pee-ink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;border-radius:20px;padding:12px 10px 10px;min-width:0;border:3px solid var(--sticker);box-shadow:2px 4px 0 rgba(90,110,150,.12);overflow:hidden}
.tile .ti{position:absolute;right:-6px;bottom:-8px;width:44px;height:44px;opacity:.35;transform:rotate(-12deg)}.tile .ti svg{width:100%;height:100%}
.tile:nth-child(2){transform:rotate(1deg)}.tile:nth-child(3){transform:rotate(-1deg)}
.card h2 .mi{width:24px;height:24px;margin-right:4px;vertical-align:-5px}
.tile .lbl{font-size:12px}
.tile .val{font-family:var(--f-display);font-size:20px;line-height:1.2;word-break:keep-all}
.tile .lbl{word-break:keep-all}
.tile.a{background:var(--pants);color:var(--pants-ink)}
.tile.b{background:var(--diaper);color:var(--diaper-ink)}
.tile.c{background:var(--oops);color:var(--oops-ink)}
.tile.p{background:var(--poo);color:var(--poo-ink)}

/* nav */
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none}
nav .in{pointer-events:auto;background:var(--surface);border:3px solid var(--sticker);outline:2px solid var(--line);border-radius:28px;box-shadow:3px 5px 0 rgba(90,110,150,.16)}
nav .in{max-width:456px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding:4px}
nav button{border-radius:20px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
nav button .e{font-size:22px;line-height:1.1;filter:grayscale(1);opacity:.55}
nav button[aria-current="page"]{color:var(--pee-ink);font-weight:800;background:var(--pee)}
nav button[aria-current="page"] .e{filter:none;opacity:1;animation:wig .5s ease}
@keyframes wig{30%{transform:rotate(-12deg) scale(1.15)}60%{transform:rotate(8deg)}}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:20px;padding:12px 10px 12px 16px;display:flex;flex-direction:column;gap:8px;z-index:9;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast .r{display:flex;align-items:center;gap:10px;justify-content:space-between}
.toast button{color:var(--bg);font-weight:800;padding:4px 8px;text-decoration:underline;white-space:nowrap}
.toast .q{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.toast .q button{text-decoration:none;background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(20,24,32,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px;background:var(--bg)}
.opts button[aria-pressed="true"]{border-color:var(--sel);background:var(--sel);color:var(--surface);font-weight:800}
.flabel{font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label,.memo-field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fields input,.memo-field input{font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.acts{display:flex;gap:8px}
.acts button{flex:1;padding:14px;border-radius:16px;font-weight:800}
.save{background:var(--sel);color:var(--surface)}
.cancel{background:var(--bg);border:1px solid var(--line)!important}
.del{color:var(--danger);font-weight:700;padding:8px}
.confirm{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;font-size:14px}
.confirm button{background:var(--danger);color:#fff;border-radius:10px;padding:8px 14px;font-weight:800}
.spark{position:fixed;z-index:20;pointer-events:none;font-size:16px;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body>
<div class="wrap" id="app"></div>
<nav><div class="in">
  <button id="tab-today" data-tab="today" aria-current="page"><span class="e">🏠</span>오늘</button>
  <button id="tab-records" data-tab="records"><span class="e">📅</span>기록</button>
  <button id="tab-stats" data-tab="stats"><span class="e">📊</span>통계</button>
</div></nav>
<div id="toastHost"></div>
<div id="sheetHost"></div>

<script>
const TYPES={
  pee:{icon:'💧',label:'쉬',btn:'쉬했어요',cls:'pee',done:'쉬 기록'},
  poo:{icon:'💩',label:'응가',btn:'응가했어요',cls:'poo',done:'응가 기록'},
  pantsOn:{icon:'🩲',label:'팬티 착용',btn:'팬티 입었어요',cls:'pants',done:'팬티 착용 기록'},
  accident:{icon:'💦',label:'팬티 실수',btn:'팬티에 실수했어요',cls:'oops',done:'실수 기록'},
  diaper:{icon:'🧷',label:'기저귀로 변경',btn:'기저귀로 바꿨어요',cls:'diaper',done:'기저귀 변경 기록'},
  dry:{icon:'🌟',label:'뽀송 확인',btn:'뽀송했어요',cls:'dry',done:'뽀송 기록'},
  sleep:{icon:'😴',label:'잠들었어요',btn:'잠들었어요',cls:'sleep',done:'잠 기록'},
  wake:{icon:'🌞',label:'일어났어요',btn:'일어났어요',cls:'wake',done:'기상 기록'},
  memo:{icon:'📝',label:'메모',cls:'memo',done:'메모 저장'}
};
const SAY={dry:'뽀송뽀송! 🌟',sleep:'잘 자요 🌙',wake:'좋은 아침! ☀️',pee:'쉬 기록 완료! 💧',poo:'응가 기록했어요 💩',pantsOn:'팬티 입었다! 🩲',accident:'괜찮아요, 기록해 둘게요 🫧',diaper:'기저귀로 바꿨어요 🧷'};
const INK='#2A3142';
const face=(x1,x2,y,mood)=>mood==='oops'
 ?`<path d="M${x1-2.5} ${y-2}l3 2-3 2M${x2+2.5} ${y-2}l-3 2 3 2" stroke="${INK}" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="${(x1+x2)/2}" cy="${y+5}" rx="1.8" ry="2" fill="${INK}"/>`
 :`<circle cx="${x1}" cy="${y}" r="2.3" fill="${INK}"/><circle cx="${x2}" cy="${y}" r="2.3" fill="${INK}"/><circle cx="${x1+.8}" cy="${y-.8}" r=".8" fill="#fff"/><circle cx="${x2+.8}" cy="${y-.8}" r=".8" fill="#fff"/><path d="M${(x1+x2)/2-2.6} ${y+3.6}q2.6 2.6 5.2 0" stroke="${INK}" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
const blush=(x1,x2,y)=>`<ellipse cx="${x1}" cy="${y}" rx="2.8" ry="1.7" fill="#F7A8C4" opacity=".9"/><ellipse cx="${x2}" cy="${y}" rx="2.8" ry="1.7" fill="#F7A8C4" opacity=".9"/>`;
const CH={
 pee:()=>`<svg viewBox="0 0 48 48"><path d="M24 4C24 4 9 22 9 31a15 15 0 0 0 30 0C39 22 24 4 24 4Z" fill="#8EC5F5" stroke="#3F7FBF" stroke-width="2.2" stroke-linejoin="round"/><path d="M15 22q-2 3-2.5 7" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".8"/>${face(19,29,31)}${blush(15,33,35.5)}</svg>`,
 poo:()=>`<svg viewBox="0 0 48 48"><g fill="#C9935F" stroke="#7A4E2B" stroke-width="2.2" stroke-linejoin="round"><path d="M24 7q7 3 4 9"/><ellipse cx="24" cy="19" rx="9" ry="5.5"/><ellipse cx="24" cy="28" rx="13" ry="6.5"/><ellipse cx="24" cy="37.5" rx="17" ry="7"/></g><path d="M18 17q2-1.5 4-1" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".6"/>${face(19,29,35)}${blush(14.5,33.5,39)}</svg>`,
 pantsOn:()=>`<svg viewBox="0 0 48 48"><path d="M7 13h34l-2.5 12q-7 2-10 13h-9q-3-11-10-13Z" fill="#F7B6CF" stroke="#B34F7A" stroke-width="2.2" stroke-linejoin="round"/><path d="M7 13h34v5.5H7Z" fill="#FBD3E3" stroke="#B34F7A" stroke-width="2.2" stroke-linejoin="round"/><path d="M24 26.5c-2.6-3-6.4-.4-3.8 2.6L24 33l3.8-3.9c2.6-3-1.2-5.6-3.8-2.6Z" fill="#fff"/><circle cx="13" cy="15.8" r="1.2" fill="#B34F7A"/><circle cx="35" cy="15.8" r="1.2" fill="#B34F7A"/></svg>`,
 accident:()=>`<svg viewBox="0 0 48 48"><path d="M22 7C22 7 8 24 8 32a14 14 0 0 0 28 0C36 24 22 7 22 7Z" fill="#F9C795" stroke="#C46A2A" stroke-width="2.2" stroke-linejoin="round"/>${face(17,27,31,'oops')}${blush(13,31,35.5)}<path d="M39 9c0 0-4 5-4 7.5a4 4 0 0 0 8 0C43 14 39 9 39 9Z" fill="#9CCFF6" stroke="#3F7FBF" stroke-width="1.8"/><path d="M41 23l3-1M40 27l3.5 1" stroke="#C46A2A" stroke-width="1.8" stroke-linecap="round"/></svg>`,

const mi=k=>`<i class="mi" aria-hidden="true">${CH[k]()}</i>`;
const PLACES={potty:'변기에',diaper:'기저귀에',pants:'팬티에'};
const DOW=['일','월','화','수','목','금','토'];

/* ---------- time ---------- */
const pad=n=>String(n).padStart(2,'0');
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtTime=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};
const minOfDay=t=>{const d=new Date(t);return d.getHours()*60+d.getMinutes()};
function fmtDur(ms){let m=Math.round(ms/60000);if(m<1)return '1분 미만';const d=Math.floor(m/1440);m-=d*1440;const h=Math.floor(m/60),r=m%60;
  if(d)return h?`${d}일 ${h}시간`:`${d}일`;return h?(r?`${h}시간 ${r}분`:`${h}시간`):`${r}분`}
const fmtAgo=ms=>ms<60000?'방금 전':fmtDur(ms)+' 전';
function fmtDay(t,dow=true){const d=new Date(t);return `${d.getMonth()+1}월 ${d.getDate()}일`+(dow?` (${DOW[d.getDay()]})`:'')}
function whenLabel(t){const k=dayKey(t),now=Date.now();if(k===dayKey(now))return '오늘 '+fmtTime(t);if(k===dayKey(addDays(now,-1)))return '어제 '+fmtTime(t);return fmtDay(t,false)+' '+fmtTime(t)}

/* ---------- derived ---------- */
function analyze(){
  const asc=[...S.events].sort((a,b)=>a.t-b.t),info={},sessions=[],sleeps=[];let lastPee=null,lastPoo=null,pStart=null,sStart=null,lastWake=null;
  for(const e of asc){if(e.type==='sleep'){if(sStart==null)sStart=e.t}else if(e.type==='wake'){if(sStart!=null){sleeps.push({start:sStart,end:e.t});sStart=null}}}
  if(sStart!=null)sleeps.push({start:sStart,end:null});
  SLEEPS=sleeps;
  for(const e of asc){
    const I=info[e.id]={detail:'',gap:null};
    if(isPee(e)&&lastPee&&e.t-lastPee.t<MERGE){I.cont=true;I.detail=`${fmtTime(lastPee.t)} ${lastPee.type==='accident'?'실수':'쉬'}에 이어서 · 한 번으로 계산`;lastPee=e}
    else if(isPee(e)){let base;const sl=lastPee&&sleptBetween(lastPee.t,e.t);
      if(lastPee&&dayKey(lastPee.t)===dayKey(e.t)){I.gap={kind:'pee',label:sl?'잠 포함':'쉬텀',ms:e.t-lastPee.t,sleep:sl};base=`이전 쉬 ${fmtTime(lastPee.t)}${lastPee.type==='accident'?'(실수)':''}`}else base='오늘 첫 쉬';
      if(lastWake&&(!lastPee||lastWake.t>lastPee.t))base=`일어나고 ${fmtDur(e.t-lastWake.t)} 후 첫 쉬`;
      I.detail=base;lastPee=e}
    if(e.type==='pee'){}
    else if(e.type==='poo'){const parts=[];if(e.place)parts.push(PLACES[e.place]+' 했어요');if(lastPoo){I.gap={kind:'poo',label:'응가텀',ms:e.t-lastPoo.t};parts.push(`이전 응가 ${dayKey(lastPoo.t)===dayKey(e.t)?fmtTime(lastPoo.t):fmtDay(lastPoo.t,false)+' '+fmtTime(lastPoo.t)}`)}I.detail=parts.join(' · ');lastPoo=e}
    else if(e.type==='pantsOn'){pStart=e.t}
    else if(e.type==='wake'){lastWake=e;const sp=sleeps.find(x=>x.end===e.t);if(sp)I.detail=`${fmtDur(sp.end-sp.start)} 잤어요`}
    else if(e.type==='sleep'){I.detail=lastPee?`마지막 쉬 ${fmtTime(lastPee.t)}`:''}
    else if(e.type==='dry'){if(lastPee){I.dryMs=e.t-lastPee.t;I.detail=`마지막 쉬 후 ${fmtDur(I.dryMs)} 동안 뽀송`}else I.detail='기저귀 뽀송'}
    else if(e.type==='accident'){if(pStart!=null){I.pants=`팬티 착용 ${fmtDur(e.t-pStart)} 후`;I.detail=I.pants+' · '+I.detail}}
    else if(e.type==='diaper'){if(pStart!=null){I.detail=`팬티 착용시간 ${fmtDur(e.t-pStart)}`;sessions.push({start:pStart,end:e.t})}pStart=null}
  }
  if(pStart!=null)sessions.push({start:pStart,end:null});
  return {asc,info,sessions,sleeps,lastPee,lastPoo,pStart,sleeping:sStart!=null,sleepStart:sStart};
}
/* pants / diaper wearing segments for one day, continuous until now */
function wearSegments(A,from,to){
  const first=A.asc.length?A.asc[0].t:null;if(first==null)return[];
  const start=Math.max(from,first),end=Math.min(to,Date.now());if(end<=start)return[];
  const ps=A.sessions.map(x=>({st:Math.max(x.start,start),en:Math.min(x.end??Date.now(),end)})).filter(x=>x.en>x.st).sort((a,b)=>a.st-b.st);
  const out=[];let cur=start;
  for(const x of ps){if(x.st>cur)out.push({kind:'diaper',st:cur,en:x.st});out.push({kind:'pants',st:x.st,en:x.en});cur=Math.max(cur,x.en)}
  if(cur<end)out.push({kind:'diaper',st:cur,en:end});
  return out;
}
function evsIn(A,from,to){return A.asc.filter(e=>e.t>=from&&e.t<to)}
const isPee=e=>e.type==='pee'||e.type==='accident';
const MERGE=10*60000; /* 10분 안에 이어진 쉬(실수 후 변기 등)는 한 번으로 계산 */
function peeEpisodes(evs){const p=evs.filter(isPee).sort((a,b)=>a.t-b.t),out=[];for(const e of p){const l=out[out.length-1];if(l&&e.t-l.end<MERGE)l.end=e.t;else out.push({start:e.t,end:e.t})}return out}
const peeCnt=evs=>peeEpisodes(evs).length;
let SLEEPS=[];
const sleptBetween=(a,b)=>SLEEPS.some(x=>x.start<b&&(x.end??Date.now())>a);
function peeIntervals(evs){const p=peeEpisodes(evs),o=[];for(let i=1;i<p.length;i++)if(dayKey(p[i].start)===dayKey(p[i-1].end)&&!sleptBetween(p[i-1].end,p[i].start))o.push(p[i].start-p[i-1].end);return o}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const cnt=(evs,ty)=>evs.filter(e=>e.type===ty).length;
const accCnt=evs=>evs.filter(e=>e.type==='accident'||(e.type==='poo'&&e.place==='pants')).length;

const LS='shishi-v1';
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'{}');S.events=j.events||[];S.name=j.name||''}catch(e){}}
function saveLocal(){if(S.db)return;try{localStorage.setItem(LS,JSON.stringify({events:S.events,name:S.name}))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const body=e=>{const {id,...r}=e;return r};
const failToast=()=>toast('저장하지 못했어요. 잠시 후 다시 눌러 주세요.');
async function addEvent(ev){
  const e={...ev,id:uid()};S.events.push(e);render();
  if(S.db){try{await S.db.collection('events').doc(e.id).set(body(e))}catch(err){S.events=S.events.filter(x=>x.id!==e.id);render();failToast()}}else saveLocal();
  return e.id;
}
async function updateEvent(id,patch){
  const i=S.events.findIndex(x=>x.id===id);if(i<0)return;
  const n={...S.events[i],...patch};if(n.type!=='memo')delete n.text;if(n.type!=='poo'||!n.place)delete n.place;S.events[i]=n;render();
  if(S.db){try{await S.db.collection('events').doc(id).set(body(n))}catch(err){failToast()}}else saveLocal();
}
async function removeEvent(id){
  S.events=S.events.filter(x=>x.id!==id);render();
  if(S.db){try{await S.db.collection('events').doc(id).delete()}catch(err){failToast()}}else saveLocal();
}
async function setName(n){S.name=n;render();if(S.db){try{await S.db.doc('meta/settings').set({name:n})}catch(err){failToast()}}else saveLocal()}
async function connectDb(){
  if(!window.claude||!window.claude.use)return;
  let db=null;try{db=await window.claude.use('db')}catch(e){}
  if(!db)return;
  const localEvents=[...S.events],localName=S.name;let first=true;S.db=db;
  db.collection('events').orderBy('t','desc').limit(1000).onSnapshot(async snap=>{
    S.events=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(first){first=false;if(snap.empty&&localEvents.length){for(const e of localEvents){try{await db.collection('events').doc(e.id).set(body(e))}catch(x){}}}}
    render();
  },()=>{});
  db.doc('meta/settings').onSnapshot(async s=>{
    if(s.exists)S.name=s.data().name||'';else if(localName){try{await db.doc('meta/settings').set({name:localName})}catch(x){}}
    render();
  },()=>{});
}

function rowHTML(e,A){

function timeline(evs,A,isToday){
  if(!evs.length)return `<div class="empty">${isToday?'아직 오늘 기록이 없어요.<br>버튼을 누르면 지금 시간이 바로 저장돼요.':'이 날은 기록이 없어요.'}</div>`;

}

/* 24h ring clock: midnight at top, noon at bottom, like a daily schedule chart */
function ringSVG(from,A,isToday){
  const C=150,ang=m=>(m/1440)*2*Math.PI-Math.PI/2,P=(m,r)=>[C+r*Math.cos(ang(m)),C+r*Math.sin(ang(m))];
  const f=n=>n.toFixed(1);
  const arc=(m1,m2,r)=>{if(m2-m1>=1439)return `M${C} ${C-r}a${r} ${r} 0 1 1 -0.01 0`;const [x1,y1]=P(m1,r),[x2,y2]=P(m2,r);return `M${f(x1)} ${f(y1)}A${r} ${r} 0 ${m2-m1>720?1:0} 1 ${f(x2)} ${f(y2)}`};
  const wedge=(m1,m2,r)=>{const [x1,y1]=P(m1,r),[x2,y2]=P(m2,r);return `M${C} ${C}L${f(x1)} ${f(y1)}A${r} ${r} 0 ${m2-m1>720?1:0} 1 ${f(x2)} ${f(y2)}Z`};
  let s=`<svg viewBox="0 0 300 300" role="img" aria-label="하루 시계 그래프"><circle class="rbg" cx="150" cy="150" r="132"/><circle cx="150" cy="150" r="128" fill="none" stroke="var(--surface)" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity=".9"/>`;
  
  for(let h=0;h<24;h++){const maj=h%3===0,[x1,y1]=P(h*60,maj?118:124),[x2,y2]=P(h*60,132);s+=`<line class="rtick${maj?' major':''}" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}"/>`}
  for(let h=0;h<24;h+=3){const [x,y]=P(h*60,143);const lab=h===0?'🌙':h===12?'☀️':h;s+=`<text class="rlab" x="${f(x)}" y="${f(y)}" text-anchor="middle" dominant-baseline="central"${typeof lab==='string'?' font-size="14"':''}>${lab}</text>`}
  s+=`<circle class="rface" cx="150" cy="150" r="84"/>`;
  const to=from+DAY,nowT=Date.now();
  for(const se of A.sleeps){const st=Math.max(se.start,from),en=Math.min(se.end??nowT,to);if(en>st){const m1=(st-from)/60000,m2=Math.max(m1+4,(en-from)/60000);s+=`<path class="rsleep" d="${arc(m1,Math.min(m2,1440),88)}"/>`}}
  for(const g of wearSegments(A,from,to)){const m1=(g.st-from)/60000,m2=Math.min(1440,Math.max(m1+3,(g.en-from)/60000));s+=`<path class="${g.kind==='pants'?'rband':'rdiaper'}" d="${arc(m1,m2,101)}"/>`}
  for(const e of evsIn(A,from,to)){if(e.type==='memo'||e.type==='sleep'||e.type==='wake')continue;const onBand=e.type==='pantsOn'||e.type==='diaper';const [x,y]=P(minOfDay(e.t),onBand?101:116);s+=`<circle class="dot ${e.type}${onBand?' onband':''}" cx="${f(x)}" cy="${f(y)}" r="${e.type==='pee'?8:7}"/>`}
  if(isToday){const m=minOfDay(nowT),[x1,y1]=P(m,88),[x2,y2]=P(m,128);s+=`<line class="hand" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}"/><circle class="handtip" cx="${f(x2)}" cy="${f(y2)}" r="3.5"/>`}
  return s+'</svg>';
}
function ringCard(from,A,isToday,center){
  return `<div class="ringbox">${ringSVG(from,A,isToday)}<div class="ring-center">${center}</div></div>
  <div class="legend"><span><i style="background:var(--pee-dot)"></i>쉬</span><span><i style="background:var(--poo-dot)"></i>응가</span><span><i style="background:var(--oops-dot)"></i>실수</span><span><i style="background:var(--diaper-dot)"></i>기저귀로 변경</span><span><i class="band"></i>팬티 착용</span><span><i class="band" style="background:var(--diaper-band)"></i>기저귀 착용</span><span><i style="background:var(--dry-dot)"></i>뽀송</span><span><i class="band" style="background:var(--sleep-band)"></i>잠</span></div>`;
}
function daySummary(evs){
  const ints=peeIntervals(evs),p=[];
  p.push(`<span class="pill pee">${mi('pee')}쉬 <b>${peeCnt(evs)}회</b>${cnt(evs,'accident')?` (실수 ${cnt(evs,'accident')} 포함)`:''}</span>`);
  if(ints.length)p.push(`<span class="pill pee">평균 쉬텀 <b>${fmtDur(avg(ints))}</b></span>`,`<span class="pill pee">최단 <b>${fmtDur(Math.min(...ints))}</b></span>`,`<span class="pill pee">최장 <b>${fmtDur(Math.max(...ints))}</b></span>`);
  p.push(`<span class="pill poo">${mi('poo')}응가 <b>${cnt(evs,'poo')}회</b></span>`);
  const dr=cnt(evs,'dry');if(dr)p.push(`<span class="pill dry">${mi('dry')}뽀송 <b>${dr}회</b></span>`);
  const po=cnt(evs,'pantsOn'),ac=accCnt(evs);if(po)p.push(`<span class="pill pants">${mi('pantsOn')}팬티 <b>${po}회</b></span>`);if(ac)p.push(`<span class="pill oops">${mi('accident')}실수 <b>${ac}회</b></span>`);
  return `<div class="pills">${p.join('')}</div>`;
}

function renderRecords(){
  const A=analyze(),seg=`<div class="pagettl">${mi('dry')}${esc(nameI())}의 기록장</div><div class="seg" role="group" aria-label="보기">${[['day','하루','wake'],['week','일주일','pee'],['month','한 달','sleep']].map(([k,l,ic])=>`<button data-view="${k}" aria-pressed="${S.view===k}">${mi(ic)}${l}</button>`).join('')}</div>`;
  let body='';
  if(S.view==='day'){
    const from=sod(S.cursor),isToday=dayKey(from)===dayKey(Date.now()),evs=evsIn(A,from,from+DAY);
    const center=`<div class="l">${isToday?'오늘':fmtDay(from,false)}</div><div class="v num">💧 ${peeCnt(evs)} · 💩 ${cnt(evs,'poo')}</div><div class="s">${accCnt(evs)?`실수 ${accCnt(evs)}회`:''}</div>`;
    body=`<div class="navbar"><button class="navbtn" data-move="-1" aria-label="이전 날">‹</button><div class="ttl">${fmtDay(from)}</div><button class="navbtn" data-move="1" aria-label="다음 날">›</button></div>

    <section class="card"><h2><span style="font-size:inherit;color:inherit;font-family:inherit">${mi('dry')}기록</span> <span>최근 기록이 위</span></h2>${timeline(evs,A,isToday)}</section>`;
  } else if(S.view==='week'){
    const d0=new Date(S.cursor),mon=sod(addDays(S.cursor,-((d0.getDay()+6)%7))),sun=addDays(mon,6),todayK=dayKey(Date.now());
    const rows=[];let allInts=[],poos=0,accs=0;
    for(let i=6;i>=0;i--){const from=addDays(mon,i),evs=evsIn(A,from,from+DAY),ints=peeIntervals(evs);allInts.push(...ints);poos+=cnt(evs,'poo');accs+=accCnt(evs);
      const dt=new Date(from);let strip='';for(const se of A.sleeps){const st=Math.max(se.start,from),en=Math.min(se.end??Date.now(),from+DAY);if(en>st)strip+=`<span class="nt" style="left:${(st-from)/DAY*100}%;width:${(en-st)/DAY*100}%"></span>`}
      for(const g of wearSegments(A,from,from+DAY))strip+=`<span class="${g.kind==='pants'?'pb':'db'}" style="left:${(g.st-from)/DAY*100}%;width:${Math.max(.8,(g.en-g.st)/DAY*100)}%"></span>`;
      for(const e of evs){if(e.type==='memo')continue;strip+=`<span class="pd ${e.type}" style="left:${minOfDay(e.t)/14.4}%"></span>`}
      const sum=evs.length?`💧 <b>${peeCnt(evs)}</b>${ints.length?` · 쉬텀 <b>${fmtDur(avg(ints))}</b>`:''} · 💩 <b>${cnt(evs,'poo')}</b>${accCnt(evs)?` · 💦 <b>${accCnt(evs)}</b>`:''}`:'기록 없음';
      rows.push(`<button class="wrow${dayKey(from)===todayK?' is-today':''}" data-day="${from}"><span class="dl"><b>${DOW[dt.getDay()]}</b>${dt.getMonth()+1}/${dt.getDate()}</span><span class="strip">${strip}</span><span class="wsum">${sum}</span></button>`)}
    body=`<div class="navbar"><button class="navbtn" data-move="-7" aria-label="이전 주">‹</button><div class="ttl">${fmtDay(mon,false)} – ${fmtDay(sun,false)}</div><button class="navbtn" data-move="7" aria-label="다음 주">›</button></div>

      <div class="axis"><span></span><div class="hrs"><span style="left:0">0시</span><span style="left:25%">6</span><span style="left:50%">12</span><span style="left:75%">18</span><span style="left:100%">24</span></div></div>
      ${rows.join('')}
      <div class="legend"><span><i style="background:var(--pee-dot)"></i>쉬</span><span><i style="background:var(--poo-dot)"></i>응가</span><span><i style="background:var(--oops-dot)"></i>실수</span><span><i style="background:var(--diaper-dot)"></i>기저귀로 변경</span><span><i class="band"></i>팬티 착용</span><span><i class="band" style="background:var(--diaper-band)"></i>기저귀 착용</span><span><i style="background:var(--dry-dot)"></i>뽀송</span><span><i class="band" style="background:var(--sleep-band)"></i>잠</span></div></section>
    <section class="card"><h2>주간 요약</h2><div class="pills"><span class="pill pee">평균 쉬텀 <b>${allInts.length?fmtDur(avg(allInts)):'–'}</b></span><span class="pill poo">${mi('poo')}응가 <b>${poos}회</b></span><span class="pill oops">${mi('accident')}실수 <b>${accs}회</b></span></div></section>`;
  } else {
    const c=new Date(S.cursor),y=c.getFullYear(),m=c.getMonth(),first=new Date(y,m,1),lead=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),todayK=dayKey(Date.now());

    for(let i=0;i<lead;i++)cells+='<div class="mc blank"></div>';

      const pe=peeCnt(evs),po=cnt(evs,'poo'),ac=accCnt(evs);
      cells+=`<button class="mc${dayKey(from)===todayK?' is-today':''}${evs.length?' has':''}" data-day="${from}" aria-label="${m+1}월 ${d}일"><span class="n">${d}</span>${pe?`<span class="c">${mi('pee')}${pe}</span>`:''}${po?`<span class="c">${mi('poo')}${po}</span>`:''}${ac?`<span class="c">${mi('accident')}${ac}</span>`:''}</button>`}
    body=`<div class="navbar"><button class="navbtn" data-month="-1" aria-label="이전 달">‹</button><div class="ttl">${y}년 ${m+1}월</div><button class="navbtn" data-month="1" aria-label="다음 달">›</button></div>

  }
  return header()+seg+body+`<button class="addbtn" id="addPast">＋ 놓친 기록 추가하기</button>`;
}

function renderStats(){
  const A=analyze(),now=Date.now(),rows=[];
  for(let i=6;i>=0;i--){const from=sod(addDays(now,-i)),ints=peeIntervals(evsIn(A,from,from+DAY));rows.push({from,dow:DOW[new Date(from).getDay()],v:avg(ints),today:i===0})}
  const max=Math.max(...rows.map(r=>r.v||0),1),has=rows.filter(r=>r.v!=null);
  let trend='하루에 쉬를 2번 이상 기록하면 쉬텀이 계산돼요.';
  if(has.length>=2){const diff=has[has.length-1].v-has[0].v;trend=Math.abs(diff)<5*60000?'이번 주 쉬텀은 비슷하게 유지되고 있어요.':diff>0?`${has[0].dow}요일보다 쉬텀이 <b>${fmtDur(diff)} 길어졌어요</b>.`:`${has[0].dow}요일보다 쉬텀이 ${fmtDur(-diff)} 짧아졌어요.`}
  const from=sod(addDays(now,-6)),wk=evsIn(A,from,now+1);
  const ses=A.sessions.filter(s=>s.end&&s.start>=from),avgWear=avg(ses.map(s=>s.end-s.start));
  const poos=wk.filter(e=>e.type==='poo'),pl=k=>poos.filter(e=>e.place===k).length;
  const poGaps=[];const allPoo=A.asc.filter(e=>e.type==='poo');for(let i=1;i<allPoo.length;i++)if(allPoo[i].t>=from)poGaps.push(allPoo[i].t-allPoo[i-1].t);
  return header()+`
  <div class="pagettl">${mi('pee')}${esc(nameI())}의 성장 노트</div>
  <section class="card"><h2><span style="font-size:inherit;color:inherit;font-family:inherit">${mi('pee')}쉬텀</span> <span>최근 7일 · 하루 평균</span></h2>
    <div class="bars">${rows.map(r=>`<div class="bar${r.today?' today':''}"><span class="d"><b>${r.dow}</b> ${new Date(r.from).getDate()}</span><span class="track"><span class="fill" style="width:${r.v?Math.max(4,r.v/max*100):0}%"></span>${r.v?`<span class="mi" style="left:${Math.max(4,r.v/max*100)}%">${CH.pee()}</span>`:''}</span><span class="v${r.v==null?' none':''}">${r.v!=null?fmtDur(r.v):'기록 없음'}</span></div>`).join('')}</div>
    <div class="tip">${MASCOT(false)}<div class="say">${trend}</div></div></section>
  <section class="card"><h2><span style="font-size:inherit;color:inherit;font-family:inherit">${mi('pantsOn')}팬티</span> <span>최근 7일</span></h2>
    <div class="tiles"><div class="tile a"><i class="ti" aria-hidden="true">${CH.pantsOn()}</i><div class="lbl">팬티 착용</div><div class="val num">${cnt(wk,'pantsOn')}회</div></div>
      <div class="tile b"><i class="ti" aria-hidden="true">${CH.diaper()}</i><div class="lbl">평균 착용</div><div class="val num">${avgWear!=null?fmtDur(avgWear):'–'}</div></div>
      <div class="tile c"><i class="ti" aria-hidden="true">${CH.accident()}</i><div class="lbl">실수 (쉬·응가)</div><div class="val num">${accCnt(wk)}회</div></div></div>
    <div class="note2">평균 착용시간은 '기저귀로 바꿨어요'까지 기록된 착용만 계산해요.</div></section>
  <section class="card"><h2><span style="font-size:inherit;color:inherit;font-family:inherit">${mi('dry')}뽀송 · 잠</span> <span>최근 7일</span></h2>
    <div class="tiles"><div class="tile" style="background:var(--dry);color:var(--dry-ink)"><i class="ti" aria-hidden="true">${CH.dry()}</i><div class="lbl">뽀송 확인</div><div class="val num">${cnt(wk,'dry')}회</div></div>
      <div class="tile" style="background:var(--dry);color:var(--dry-ink)"><i class="ti" aria-hidden="true">${CH.wake()}</i><div class="lbl">가장 긴 뽀송</div><div class="val num">${(()=>{const d=wk.filter(e=>e.type==='dry').map(e=>A.info[e.id].dryMs).filter(Boolean);return d.length?fmtDur(Math.max(...d)):'–'})()}</div></div>
      <div class="tile" style="background:var(--sleep);color:var(--sleep-ink)"><i class="ti" aria-hidden="true">${CH.sleep()}</i><div class="lbl">하루 평균 잠</div><div class="val num">${(()=>{const t=A.sleeps.filter(x=>x.end&&x.end>=from).reduce((a,x)=>a+(x.end-x.start),0);const days=new Set(A.sleeps.filter(x=>x.end&&x.end>=from).map(x=>dayKey(x.end))).size;return days?fmtDur(t/days):'–'})()}</div></div></div>
    <div class="note2">잠든 사이의 간격은 쉬텀 평균에서 빼고 계산해요.</div></section>
  <section class="card"><h2><span style="font-size:inherit;color:inherit;font-family:inherit">${mi('poo')}응가</span> <span>최근 7일</span></h2>
    <div class="tiles"><div class="tile p"><i class="ti" aria-hidden="true">${CH.poo()}</i><div class="lbl">응가</div><div class="val num">${poos.length}회</div></div>
      <div class="tile p"><i class="ti" aria-hidden="true">${CH.poo()}</i><div class="lbl">평균 응가텀</div><div class="val num">${poGaps.length?fmtDur(avg(poGaps)):'–'}</div></div>

  <section class="card"><h2>백업 <span>폰을 바꾸거나 초기화하기 전에</span></h2>
    <div class="acts"><button class="cancel" id="bkExport">내보내기</button><button class="cancel" id="bkImport">불러오기</button></div>
    <input type="file" id="bkFile" accept="application/json,.json" hidden>
    <div class="note2">기록은 이 폰 안에만 저장돼요. 가끔 내보내기 파일을 저장해 두세요.</div></section>`;
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg,undoId,ask){
  clearTimeout(toastTimer);
  $('#toastHost').innerHTML=`<div class="toast" role="status"><div class="r"><span>${msg}</span>${undoId?'<button id="undoBtn">되돌리기</button>':''}</div>${ask?`<div class="q"><span>어디에 했어요?</span>${Object.entries(PLACES).map(([k,v])=>`<button data-place="${k}">${v.slice(0,-1)}</button>`).join('')}</div>`:''}</div>`;
  if(undoId)$('#undoBtn').onclick=()=>{removeEvent(undoId);$('#toastHost').innerHTML=''};
  if(ask)document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{updateEvent(undoId,{place:b.dataset.place});toast(`응가 · ${PLACES[b.dataset.place]} 했어요`)});
  toastTimer=setTimeout(()=>{$('#toastHost').innerHTML=''},ask?8000:undoId?5000:3000);
}

/* ---------- edit sheet ---------- */
function openSheet(id){
  const src=id?S.events.find(x=>x.id===id):{type:'pee',t:Date.now()};if(!src)return;
  const e={...src};let confirm=false;const d=new Date(e.t);
  const keep=()=>{const dv=$('#fDate')?.value,tv=$('#fTime')?.value;if(dv&&tv)d.setTime(new Date(`${dv}T${tv}`).getTime());if($('#fText'))e.text=$('#fText').value};
  const close=()=>{$('#sheetHost').innerHTML=''};
  const draw=()=>{
    $('#sheetHost').innerHTML=`<div class="veil" id="veil"><div class="sheet" role="dialog" aria-modal="true" aria-label="${id?'기록 수정':'기록 추가'}">
      <h3>${id?'기록 수정':'놓친 기록 추가'}</h3>
      <div class="opts">${Object.entries(TYPES).map(([k,T])=>`<button data-type="${k}" aria-pressed="${k===e.type}">${T.icon} ${k==='memo'?'메모':T.label}</button>`).join('')}</div>
      ${e.type==='poo'?`<div class="flabel">어디에 했어요? (선택)</div><div class="opts">${[['','선택 안 함'],...Object.entries(PLACES).map(([k,v])=>[k,v.slice(0,-1)])].map(([k,v])=>`<button data-pl="${k}" aria-pressed="${(e.place||'')===k}">${v}</button>`).join('')}</div>`:''}
      <div class="fields"><label>날짜<input type="date" id="fDate" value="${dayKey(d)}"></label><label>시간<input type="time" id="fTime" value="${fmtTime(d)}"></label></div>
      ${e.type==='memo'?`<label class="memo-field">메모 내용<input id="fText" maxlength="40" value="${esc(e.text||'')}"></label>`:''}
      <div class="acts"><button class="cancel" id="sCancel">닫기</button><button class="save" id="sSave">저장</button></div>
      ${id?(confirm?'<div class="confirm"><span>이 기록을 삭제할까요?</span><button id="sDelYes">삭제</button></div>':'<button class="del" id="sDel">기록 삭제</button>'):''}
    </div></div>`;
    $('#veil').onclick=ev=>{if(ev.target.id==='veil')close()};
    document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{keep();e.type=b.dataset.type;draw()});
    document.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{keep();e.place=b.dataset.pl||undefined;draw()});
    $('#sCancel').onclick=close;
    $('#sSave').onclick=()=>{
      const dv=$('#fDate').value,tv=$('#fTime').value;if(!dv||!tv)return;
      const p={type:e.type,t:new Date(`${dv}T${tv}`).getTime()};
      if(e.type==='memo'){const tx=($('#fText')?.value||'').trim();if(!tx){$('#fText').focus();return}p.text=tx}
      if(e.type==='poo'&&e.place)p.place=e.place;
      if(id)updateEvent(id,p);else addEvent(p);
      close();toast(id?'수정했어요':'추가했어요');
    };
    if(id&&!confirm)$('#sDel').onclick=()=>{keep();confirm=true;draw()};
    if(id&&confirm)$('#sDelYes').onclick=()=>{removeEvent(id);close();toast('삭제했어요')};
  };
  draw();
}

function burst(el,icon){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,set=[icon,'✨','💛',icon,'✨','🩵',icon,'✨'];
  set.forEach((c,i)=>{const sp=document.createElement('span');sp.className='spark';sp.textContent=c;const a=i/set.length*Math.PI*2,d=60+Math.random()*30;
    sp.style.left=cx-8+'px';sp.style.top=cy-10+'px';sp.style.setProperty('--dx',Math.cos(a)*d+'px');sp.style.setProperty('--dy',Math.sin(a)*d+'px');sp.style.setProperty('--r',(Math.random()*80-40)+'deg');
    document.body.appendChild(sp);setTimeout(()=>sp.remove(),850)});
}
function doRecord(k,el,extra){
  if(el)burst(el,TYPES[k].icon);
  S.say={text:extra&&extra.place==='pants'?'괜찮아요, 기록해 둘게요 🫧':SAY[k],until:Date.now()+3000};
  setTimeout(()=>{if(!$('#sheetHost').innerHTML&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))render()},3100);
  return addEvent({type:k,t:Date.now(),...(extra||{})}).then(id=>{
    const A=analyze(),I=A.info[id]||{};let msg=`${TYPES[k].icon} ${fmtTime(Date.now())} ${extra&&extra.place==='pants'?'응가 실수 기록':TYPES[k].done}`;
    if(I.cont)msg+=' · 바로 전 쉬와 한 번으로 계산';else if(k==='accident'&&I.pants)msg+=` · ${I.pants}`;if(I.gap)msg+=` · ${I.gap.label} ${fmtDur(I.gap.ms)}`;else if(I.detail&&(k==='poo'||k==='dry'||k==='wake'))msg+=` · ${I.detail}`;
    toast(msg,id,k==='poo'&&!(extra&&extra.place));
    const b=document.querySelector(`[data-rec="${k}"]`);if(b){b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),500)}
  });
}
/* one-tap shortcuts: ?rec=pee (web app) or #rec-pee (claude.ai link) */
function quickFromUrl(){
  let k=null;try{k=new URLSearchParams(location.search).get('rec')}catch(e){}
  const h=(location.hash||'').match(/^#rec-([A-Za-z]+)$/);if(h)k=h[1];
  if(!k)return;
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  if(k==='sleeptoggle')k=analyze().sleeping?'wake':'sleep';
  if(!TYPES[k]||k==='memo')return;
  S.tab='today';
  if(S.events.some(e=>e.type===k&&Date.now()-e.t<60000)){toast(`${TYPES[k].icon} 1분 안에 이미 기록됐어요`);render();return}
  doRecord(k,null);
}
/* ---------- interactions ---------- */
document.addEventListener('click',ev=>{
  const rec=ev.target.closest('[data-rec]');
  if(rec){doRecord(rec.dataset.rec,rec);return}
  const po=ev.target.closest('[data-poooops]');if(po){doRecord('poo',po,{place:'pants'});return}
  const wb=ev.target.closest('[data-wear]');
  if(wb){const k=wb.dataset.wear,wearingNow=analyze().pStart!=null;
    if((k==='pantsOn')===wearingNow){toast(wearingNow?'🩲 지금 팬티 입고 있어요':'🧷 지금 기저귀 차고 있어요');return}
    doRecord(k,wb);return}
  const ed=ev.target.closest('[data-edit]');if(ed){openSheet(ed.dataset.edit);return}
  const chip=ev.target.closest('[data-chip]');if(chip){addEvent({type:'memo',t:Date.now(),text:chip.dataset.chip}).then(id=>toast('📝 메모 저장',id));return}
  const tab=ev.target.closest('[data-tab]');if(tab){S.tab=tab.dataset.tab;S.editingName=false;if(S.tab==='records'){S.cursor=Date.now()}render();window.scrollTo(0,0);return}
  const vw=ev.target.closest('[data-view]');if(vw){S.view=vw.dataset.view;render();return}
  const mv=ev.target.closest('[data-move]');if(mv){S.cursor=addDays(S.cursor,+mv.dataset.move);render();return}
  const mo=ev.target.closest('[data-month]');if(mo){const c=new Date(S.cursor);S.cursor=new Date(c.getFullYear(),c.getMonth()+(+mo.dataset.month),1).getTime();render();return}
  const dd=ev.target.closest('[data-day]');if(dd){S.cursor=+dd.dataset.day;S.view='day';render();window.scrollTo(0,0);return}
  if(ev.target.closest('[data-goto]')){S.cursor=Date.now();render();return}
  if(ev.target.closest('#nameBtn')){S.editingName=true;render();return}
  if(ev.target.closest('#addPast')){openSheet(null);return}
});
document.addEventListener('submit',ev=>{if(ev.target.id==='memoForm'){ev.preventDefault();const i=$('#memoInput'),v=i.value.trim();if(!v)return;i.value='';addEvent({type:'memo',t:Date.now(),text:v}).then(id=>toast('📝 메모 저장',id))}});
function commitName(){const i=$('#nameInput');if(!i)return;const v=i.value.trim();S.editingName=false;if(v!==S.name)setName(v);else render()}
document.addEventListener('keydown',ev=>{if(ev.target.id==='nameInput'){if(ev.key==='Enter')commitName();if(ev.key==='Escape'){S.editingName=false;render()}}});
document.addEventListener('focusout',ev=>{if(ev.target.id==='nameInput')setTimeout(commitName,0)});
setInterval(()=>{const a=document.activeElement;if(!$('#sheetHost').innerHTML&&!(a&&a.tagName==='INPUT'))render()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#sheetHost').innerHTML)render()});

document.addEventListener('click',ev=>{
  if(ev.target.closest('#bkExport')){const blob=new Blob([JSON.stringify({app:'shishi',v:1,name:S.name,events:S.events},null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`쉬쉬기록-백업-${dayKey(Date.now())}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
  if(ev.target.closest('#bkImport'))$('#bkFile').click();
});
document.addEventListener('change',async ev=>{
  if(ev.target.id!=='bkFile'||!ev.target.files[0])return;
  try{const j=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(j.events))throw 0;
    const have=new Set(S.events.map(e=>e.id));let n=0;for(const e of j.events){if(e&&e.id&&e.type&&e.t&&!have.has(e.id)){S.events.push(e);n++}}
    if(!S.name&&j.name)S.name=j.name;saveLocal();render();toast(`기록 ${n}개를 불러왔어요`)}
  catch(x){toast('백업 파일을 읽지 못했어요. 쉬쉬기록에서 내보낸 파일인지 확인해 주세요.')}
  ev.target.value='';
});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
loadLocal();render();quickFromUrl();
</script>
